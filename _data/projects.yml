# Tight Lower Bounds and Improved Convergence in Performative Prediction
- project: "Tight Lower Bounds and Improved Convergence in Performative Prediction"
  # role: Co-Author
  duration: Preprint (2024)
  url: "https://arxiv.org/abs/2412.03671"  # Replace with the actual link if available
  # authors: "Khorsandi P., Gupta R., Mofakhami M., Lacoste-Julien S., Gidel G."
  description: This paper extends the Repeated Risk Minimization (RRM) framework by leveraging historical datasets from previous retraining snapshots. It introduces a class of algorithms called Affine Risk Minimizers, proving the tightness of both new and existing bounds in the same regime, and demonstrating empirical improvements in convergence for performative prediction.

# Are socially-aware trajectory prediction models really socially-aware?
- project: "Are socially-aware trajectory prediction models really socially-aware?"
  # role: Co-Author
  duration: Elsevier Volume 141 (2022)
  url: "https://www.sciencedirect.com/science/article/pii/S0968090X22001437"
  # authors: "Saadatnejad S., Bahari M., Khorsandi P.*, Saneian M.*, Moosavi-Dezfooli M., Alahi A."
  description: Investigates the adversarial robustness of trajectory prediction models by introducing a socially-attended attack that exposes their limitations in collision avoidance. The proposed method applies hard- and soft-attention mechanisms to guide perturbations, revealing gaps in social understanding while also enhancing model performance. 

# Do explanations explain the model? Model knows best
- project: "Do explanations explain the model? Model knows best"
  # role: Co-Author
  duration: CVPR (2022)
  url: "https://arxiv.org/abs/2203.02269"
  # authors: "Khakzar A.*, Khorsandi P.*, Nobahari R.*, Navab N."
  description: Introduces a framework for evaluating feature attribution methods by leveraging the neural network itself. The framework generates input features that induce specific behaviors in the output, enabling controlled experiments to assess whether an explanation method aligns with key axioms. The evaluation exposes properties and limitations of existing explanation techniques, providing insights into their reliability.